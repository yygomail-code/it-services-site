<section class="section section--tight">
  <div class="container">
    <h1>Контакты</h1>
    <p class="text-muted">Отвечаю ежедневно с 9:00 до 21:00 (МСК). Напишите — вернусь быстро.</p>

    <div class="contacts">
      <div class="contacts__info">
        <div class="contact-item">
          <span class="contact-item__label">Телефон</span>
          <a class="contact-item__value" href="tel:+70000000000">+7 (000) 000-00-00</a>
        </div>
        <div class="contact-item">
          <span class="contact-item__label">Почта</span>
          <a class="contact-item__value" href="mailto:hello@example.ru">hello@example.ru</a>
        </div>
        <div class="contact-item">
          <span class="contact-item__label">Формат работы</span>
          <p class="contact-item__value">Удалённо по всей России, возможен выезд к заказчику</p>
        </div>
        <div class="contact-item">
          <span class="contact-item__label">График</span>
          <p class="contact-item__value">Ежедневно 9:00–21:00 (МСК)</p>
        </div>
      </div>

      <div class="contacts__form">
        <div class="card">
          <h2>Оставить заявку</h2>
          <p class="text-muted">Расскажите о задаче — предложу решение и смету.</p>
          <app-lead-form submitLabel="Отправить заявку" />
        </div>
      </div>
    </div>
  </div>
</section>
