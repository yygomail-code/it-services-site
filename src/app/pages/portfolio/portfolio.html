<section class="section section--tight">
  <div class="container">
    <h1>Портфолио</h1>
    <p class="text-muted">Примеры проектов. Имена клиентов могу раскрыть при запросе.</p>

    <div class="filters" role="tablist" aria-label="Фильтр по категориям">
      @for (category of categories; track category) {
        <button
          type="button"
          class="filter"
          [class.filter--active]="activeCategory === category"
          (click)="setCategory(category)"
        >
          {{ category === 'all' ? 'Все' : category }}
        </button>
      }
    </div>

    <div class="cases-grid">
      @for (case of filteredCases; track case.slug) {
        <app-case-card [case]="case" />
      }
    </div>
  </div>
</section>

<section class="section section--cta">
  <div class="container">
    <div class="cta-box">
      <h2>Хотите такой же результат?</h2>
      <p>Расскажите о задаче — предложу решение и покажу, как это сделаю.</p>
      <app-lead-form submitLabel="Обсудить проект" />
    </div>
  </div>
</section>
