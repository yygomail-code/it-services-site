<section class="section section--tight">
  <div class="container">
    <h1>Услуги</h1>
    <p class="text-muted">Выберите, что нужно вашему бизнесу. Не нашли задачу — напишите, обсудим.</p>
  </div>
</section>

<section class="section section--tight">
  <div class="container">
    <div class="services-grid">
      @for (service of services; track service.slug) {
        <app-service-card [service]="service" />
      }
    </div>
  </div>
</section>

<section class="section section--cta">
  <div class="container">
    <div class="cta-box">
      <h2>Не знаете, что выбрать?</h2>
      <p>Расскажите о задаче — помогу определиться и предложу оптимальное решение.</p>
      <a class="btn btn--primary btn--lg" routerLink="/contacts">Задать вопрос</a>
    </div>
  </div>
</section>
