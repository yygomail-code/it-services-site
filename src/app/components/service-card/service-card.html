<a class="service-card" [routerLink]="[sectionPath(), service.slug]">
  @if (service.cover) {
    <div class="service-card__cover">
      <img [src]="service.cover" [alt]="service.title" loading="lazy" />
    </div>
  } @else {
    <div class="service-card__noimg">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
      <span>Нет фото</span>
    </div>
  }
  <h3>{{ service.title }}</h3>
  <p>{{ service.short_description }}</p>
  <span class="service-card__price">{{ priceLabel() }}</span>
</a>
