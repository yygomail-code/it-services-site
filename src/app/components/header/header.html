<header class="header">
  <div class="container header__inner">
    <a class="header__logo" routerLink="/" (click)="closeMenu()">
      @if (brandLogo) {
        <img class="header__logo-img" [src]="brandLogo" alt="" />
      } @else {
        <span class="header__logo-mark">{{ brandMark }}</span>
      }
      <span class="header__logo-text" [class.header__logo-text--large]="subtitleLarge">
        {{ brandName }}
        @if (subtitle) {
          <br /><small>{{ subtitle }}</small>
        }
      </span>
    </a>

    <nav class="header__nav" [class.header__nav--open]="menuOpen" aria-label="Главное меню">
      @for (item of menuItems; track item.label + item.url) {
        <a
          [routerLink]="isExternal(item.url) ? null : item.url"
          [attr.href]="isExternal(item.url) ? item.url : null"
          [attr.target]="isExternal(item.url) ? '_blank' : null"
          [attr.rel]="isExternal(item.url) ? 'noopener' : null"
          routerLinkActive="header__link--active"
          [routerLinkActiveOptions]="isExact(item.url) ? exactOptions : looseOptions"
          (click)="closeMenu()"
        >{{ item.label }}</a>
      }

      @if (cta) {
        @if (isExternal(cta.url)) {
          <a class="header__cta" [href]="cta.url" target="_blank" rel="noopener" (click)="closeMenu()">{{ cta.label }}</a>
        } @else {
          <a class="header__cta" [routerLink]="cta.url" (click)="closeMenu()">{{ cta.label }}</a>
        }
      }
    </nav>

    <button
      class="header__burger"
      type="button"
      aria-label="Открыть меню"
      [attr.aria-expanded]="menuOpen"
      (click)="toggleMenu()"
    >
      <span></span><span></span><span></span>
    </button>
  </div>
</header>
