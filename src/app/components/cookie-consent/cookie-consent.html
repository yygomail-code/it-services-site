<div class="cookie-consent" role="dialog" aria-live="polite" aria-label="Уведомление об использовании файлов cookie">
  <div class="cookie-consent__inner">
    <p>
      Мы используем файлы cookie (куки) для корректной работы сайта, сбора статистики посещаемости
      (Яндекс.Метрика) и улучшения сервиса. Продолжая пользоваться сайтом, вы соглашаетесь
      с <a routerLink="/policy">политикой обработки персональных данных</a>.
    </p>
    <div class="cookie-consent__actions">
      <button type="button" class="btn btn--primary" (click)="accept()">Принять</button>
      <button type="button" class="btn btn--ghost" (click)="decline()">Отклонить</button>
    </div>
  </div>
</div>
